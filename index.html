<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carb Counter</title>
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Carb Counter</h1>
        <label for="cups">Cup of Cooked Rice:</label>
        <input id="cups" type="number" min="0" step="0.5">
        <button id="calculate" >Calculate</button>

        <p id="result"></p>

        <p class="disclaimer">Values are estimates. Always follow your doctors advice.</p>
    </main>
</body>
</html>
