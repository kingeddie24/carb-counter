<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carb Counter</title>
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Carb Counter</h1>
        <label for="food">Food:</label>
        <select id="food">
            <option value="rice">Cooked jollof rice</option>
            <option value="yam">Pounded yam</option>
            <option value="garri">Garri (Eba)</option>
            <option value="beans">Cooked brown beans</option>
            <option value="plantain">Fried plantain</option>
        </select>
        <label for="portions">Number of Portions:</label>
        <input id="portions" type="number" min="0" step="0.5">
        <button id="calculate">Calculate</button>

        <p id="result"></p>

        <p class="disclaimer">Values are estimates. Always follow your doctors advice.</p>
    </main>
</body>
</html>
